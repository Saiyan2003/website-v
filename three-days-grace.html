<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>

    document.querySelectorAll(".product-section").forEach(section => {

        new Swiper(
            section.querySelector(".productSwiper"),
            {
                slidesPerView: 2,
                spaceBetween: 5,

                navigation: {
                    nextEl: section.querySelector(".btn-next"),
                    prevEl: section.querySelector(".btn-prev"),
                },

                breakpoints: {

                    576: {
                        slidesPerView: 2
                    },

                    768: {
                        slidesPerView: 3
                    },

                    992: {
                        slidesPerView: 4
                    },

                    1200: {
                        slidesPerView: 5
                    }

                }
            }
        );

    });

    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightboxImage");
    const closeBtn = document.getElementById("closeBtn");

    document.querySelectorAll(".product-card img").forEach(img => {
        img.addEventListener("click", () => {
            lightboxImage.src = img.src;
            lightbox.classList.add("show");
        });
    });

    document.querySelectorAll(".card img").forEach(img => {
        img.addEventListener("click", () => {
            lightboxImage.src = img.src;
            lightbox.classList.add("show");
        });
    });


    closeBtn.addEventListener("click", closeLightbox);
    lightbox.addEventListener("click", (e) => {
        if (e.target === lightbox) {
            closeLightbox();
        }
    });

    function closeLightbox() {
        lightbox.classList.remove("show");
        setTimeout(() => {
            lightbox.style.display = "none";
            lightboxImage.src = "";
        }, 300); // espera a que la animación termine
    }

    // Para que se muestre el display correctamente al usar la clase "show"
    const observer = new MutationObserver(() => {
        if (lightbox.classList.contains("show")) {
            lightbox.style.display = "flex";
        }
    });
    observer.observe(lightbox, { attributes: true });

</script>
